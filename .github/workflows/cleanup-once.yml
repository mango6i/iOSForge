name: One-time cleanup of obsolete runs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-once.yml']
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'mango6i/iOSForge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete only reviewed completed runs and their artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path
          
