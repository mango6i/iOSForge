name: Interface and folder regression checks
on:
  push:
    branches: [shudong-folder-checks]
permissions:
  contents: write
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check folder permission behavior
        run: |
          swiftc -parse-as-library AccountCheck/FolderAccess.swift FolderAccessSelfTests.swift -o /tmp/folder-tests
          /tmp/folder-tests
      - name: Check account parsing and read-only database behavior
        run: |
          swiftc -parse-as-library AccountCheck/Core.swift AccountCheck/FolderAccess.swift AccountCheck/SQLiteReader.swift CoreSelfTests.swift -o /tmp/core-tests -lsqlite3
          /tmp/core-tests
      - name: Check iPhone source types without building an app or IPA
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios15.0 -module-name AccountCheck AccountCheck/*.swift
      - name: Validate project inputs
        run: python3 scripts/validate_project.py
      - name: Review compact native layouts and removal behavior
        id: ui
        run: bash render-ui.sh
      - name: Verify archive identity with a separate tiny macOS fixture
        run: python3 ArchiveIdentitySelfTests.py
      - name: Save synthetic native previews on the check branch
        if: ${{ always() && steps.ui.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-previews
          git diff --cached --quiet || git commit -m 'Save synthetic compact interface previews'
          git push origin HEAD:shudong-folder-checks
