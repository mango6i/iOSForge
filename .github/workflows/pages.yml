name: Publish iOSForge Web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "scripts/make_starter.py"
      - "iosforge/**"
      - "iosforge.toml"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
      - ".github/workflows/environment.yml"
      - ".github/actions/setup-ios/action.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Package clean private-workspace starter
        run: python3 scripts/make_starter.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
