name: Publish iOSForge Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "scripts/make_starter.py"
      - "scripts/make_release.py"
      - "iosforge/**"
      - "iosforge.toml"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
      - ".github/workflows/environment.yml"
      - ".github/actions/setup-ios/action.yml"
      - ".github/scripts/cleanup.py"
      - ".github/scripts/sync_upstream.py"
      - ".github/workflows/cleanup.yml"
      - ".github/workflows/upstream-sync.yml"
      - ".github/scripts/site_config.py"
      - ".github/iosforge-release.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Publish the upstream tool release index
        if: github.repository == 'mango6i/iOSForge'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOSFORGE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/make_release.py --publish
      - name: Package clean private-workspace starter
        run: python3 scripts/make_starter.py
      - name: Bind this website to its own repository
        env:
          IOSFORGE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python3 .github/scripts/site_config.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
