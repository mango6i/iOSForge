name: GitHub Actions
run-name: iOSForge · ${{ inputs.build_type || 'auto' }} · ${{ github.ref_name }}
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
      - '.github/workflows/environment.yml'
      - '**/*.ipa'
      - '**/*.deb'
      - '**/*.dylib'
  workflow_dispatch:
    inputs:
      build_type:
        description: auto 自动识别全部工程，或指定产物
        required: true
        default: auto
        type: choice
        options: [auto, dylib, deb, ipa]
      xcode_project:
        description: Xcode 工程路径（单工程可留空自动识别）
        type: string
        default: ''
      xcode_scheme:
        description: Scheme（唯一共享应用方案可留空）
        type: string
        default: ''
      ipa_signing:
        description: unsigned 无证书（巨魔/后续自签）；signed 证书导出
        type: choice
        default: unsigned
        options: [unsigned, signed]
      export_options:
        description: 仅 signed 模式需要的导出配置
        type: string
        default: ExportOptions.plist
permissions:
  contents: read
concurrency:
  group: iosforge-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect-source:
    name: Identify uploaded source
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.plan.outputs.plugin }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find projects
        id: plan
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'auto' }}
          XCODE_PROJECT: ${{ inputs.xcode_project }}
        run: python -m iosforge.ci plan --type "$BUILD_TYPE"
  build-plugin:
    name: Build iOS 15+ plugin
    needs: detect-source
    if: needs.detect-source.outputs.plugin == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ios
        with:
          xcode-version: ${{ vars.IOSFORGE_XCODE_VERSION || '16.4' }}
          theos: 'true'
      - name: Compile and package
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            dylib) iosforge build-dylib --output-dir dist ;;
            deb) iosforge build-deb --output-dir dist ;;
            auto) iosforge build-tweak --output-dir dist ;;
            *) echo "Unexpected plugin build type"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: inputs.build_type != 'deb'
        with:
          name: iosforge-dylib
          path: dist/*.dylib
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.build_type == 'auto' || inputs.build_type == 'deb'
        with:
          name: iosforge-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
  build-ipa:
    name: Build iOS 15+ IPA
    needs: detect-source
    if: needs.detect-source.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ios
        with:
          xcode-version: ${{ vars.IOSFORGE_XCODE_VERSION || '16.4' }}
      - name: Build and package IPA
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          EXPORT_OPTIONS: ${{ inputs.export_options || 'ExportOptions.plist' }}
          IPA_SIGNING: ${{ inputs.ipa_signing || 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--output-dir dist)
          if [ -n "$XCODE_PROJECT" ]; then args+=(--project "$XCODE_PROJECT"); fi
          if [ -n "$XCODE_SCHEME" ]; then args+=(--scheme "$XCODE_SCHEME"); fi
          case "$IPA_SIGNING" in
            unsigned) args+=(--unsigned) ;;
            signed) args+=(--export-options "$EXPORT_OPTIONS") ;;
            *) echo "Unknown IPA signing mode"; exit 1 ;;
          esac
          iosforge build-app "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: iosforge-ipa-${{ inputs.ipa_signing || 'unsigned' }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
