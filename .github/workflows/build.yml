name: Build iOSForge example

on:
  workflow_dispatch:
  push:
    paths:
      - "iosforge/**"
      - "examples/**"
      - "iosforge.toml"
      - ".github/workflows/build.yml"

jobs:
  build-tweak:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Theos
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          brew install ldid
      - name: Install iOSForge
        run: python -m pip install -e .
      - name: Validate project
        run: iosforge validate
      - name: Build example tweak
        run: iosforge build-plugin --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iosforge-plugin
          path: dist/*.deb
