name: GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - "iosforge/**"
      - "iosforge.toml"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "选择构建类型"
        required: true
        default: dylib
        type: choice
        options:
          - dylib
          - deb
          - ipa
      xcode_project:
        description: "Xcode 工程路径，例如 MyApp.xcodeproj 或 MyApp.xcworkspace"
        required: false
        default: ""
        type: string
      xcode_scheme:
        description: "Xcode Scheme 名称"
        required: false
        default: ""
        type: string
      export_options:
        description: "ExportOptions.plist 路径"
        required: false
        default: ExportOptions.plist
        type: string

permissions:
  contents: read

concurrency:
  group: iosforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-plugin:
    name: Check plugin source
    if: ${{ github.event_name == 'push' || inputs.build_type == 'dylib' || inputs.build_type == 'deb' }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect configured Theos project
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifest = Path("iosforge.toml")
          project_dir = None
          if manifest.exists():
              with manifest.open("rb") as handle:
                  project_dir = tomllib.load(handle).get("theos", {}).get("project_dir")
          available = bool(project_dir and (Path(project_dir) / "Makefile").is_file())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"available={'true' if available else 'false'}\n")
          if not available:
              print("未配置 Theos 工程，已跳过自动插件构建。请在 iosforge.toml 的 [theos].project_dir 中填写自己的工程路径。")
              if os.environ["EVENT_NAME"] == "workflow_dispatch" and os.environ["BUILD_TYPE"] in {"dylib", "deb"}:
                  raise SystemExit(1)

  build-plugin:
    name: Build dylib
    needs: detect-plugin
    if: ${{ needs.detect-plugin.outputs.available == 'true' && (github.event_name == 'push' || inputs.build_type == 'dylib' || inputs.build_type == 'deb') }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Theos
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          brew install ldid dpkg
      - name: Install iOSForge
        run: python -m pip install -e .
      - name: Validate project
        run: iosforge validate
      - name: Build dylib
        if: ${{ github.event_name == 'push' || inputs.build_type == 'dylib' }}
        run: iosforge build-dylib --output-dir dist
      - name: Build deb
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'deb' }}
        run: iosforge build-deb --output-dir dist
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || inputs.build_type == 'dylib' }}
        with:
          name: iosforge-dylib
          path: dist/*.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'deb' }}
        with:
          name: iosforge-deb
          path: dist/*.deb
          if-no-files-found: error

  build-ipa:
    name: Build IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'ipa' }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install iOSForge
        run: python -m pip install -e .
      - name: Check IPA inputs
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          EXPORT_OPTIONS: ${{ inputs.export_options }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XCODE_PROJECT" || { echo "请填写 xcode_project"; exit 1; }
          test -n "$XCODE_SCHEME" || { echo "请填写 xcode_scheme"; exit 1; }
          test -f "$XCODE_PROJECT" || { echo "找不到 Xcode 工程: $XCODE_PROJECT"; exit 1; }
          test -f "$EXPORT_OPTIONS" || { echo "找不到 ExportOptions.plist: $EXPORT_OPTIONS"; exit 1; }
      - name: Build and export IPA
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          EXPORT_OPTIONS: ${{ inputs.export_options }}
        shell: bash
        run: |
          set -euo pipefail
          iosforge build-app \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options "$EXPORT_OPTIONS" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iosforge-ipa
          path: dist/*.ipa
          if-no-files-found: error

