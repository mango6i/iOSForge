name: GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - "iosforge/**"
      - "examples/**"
      - "iosforge.toml"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "选择构建类型"
        required: true
        default: plugin
        type: choice
        options:
          - plugin
          - ipa
      xcode_project:
        description: "Xcode 工程路径，例如 MyApp.xcodeproj 或 MyApp.xcworkspace"
        required: false
        default: ""
        type: string
      xcode_scheme:
        description: "Xcode Scheme 名称"
        required: false
        default: ""
        type: string
      export_options:
        description: "ExportOptions.plist 路径"
        required: false
        default: ExportOptions.plist
        type: string

permissions:
  contents: read

concurrency:
  group: iosforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: Build dylib
    if: ${{ github.event_name == 'push' || inputs.build_type == 'plugin' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Theos
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          brew install ldid dpkg
      - name: Install iOSForge
        run: python -m pip install -e .
      - name: Validate project
        run: iosforge validate
      - name: Build dylib
        run: iosforge build-dylib --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iosforge-dylib
          path: dist/*.dylib
          if-no-files-found: error

  build-ipa:
    name: Build IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'ipa' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install iOSForge
        run: python -m pip install -e .
      - name: Check IPA inputs
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          EXPORT_OPTIONS: ${{ inputs.export_options }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XCODE_PROJECT" || { echo "请填写 xcode_project"; exit 1; }
          test -n "$XCODE_SCHEME" || { echo "请填写 xcode_scheme"; exit 1; }
          test -f "$XCODE_PROJECT" || { echo "找不到 Xcode 工程: $XCODE_PROJECT"; exit 1; }
          test -f "$EXPORT_OPTIONS" || { echo "找不到 ExportOptions.plist: $EXPORT_OPTIONS"; exit 1; }
      - name: Build and export IPA
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          EXPORT_OPTIONS: ${{ inputs.export_options }}
        shell: bash
        run: |
          set -euo pipefail
          iosforge build-app \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options "$EXPORT_OPTIONS" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iosforge-ipa
          path: dist/*.ipa
          if-no-files-found: error

