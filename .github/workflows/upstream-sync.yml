name: Update iOSForge tools

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: iosforge-upstream-sync
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Safely update tool code from the upstream repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOSFORGE_SYNC_TOKEN: ${{ secrets.IOSFORGE_SYNC_TOKEN }}
          IOSFORGE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/sync_upstream.py
