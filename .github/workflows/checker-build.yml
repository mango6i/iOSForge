name: Build Shudong Account Check
on:
  push:
    branches: [shudong-account-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source inputs
        run: python3 scripts/validate_project.py
      - name: Run core and read-only database checks
        run: |
          swiftc -parse-as-library AccountCheck/Core.swift AccountCheck/SQLiteReader.swift CoreSelfTests.swift -o /tmp/account-check-tests -lsqlite3
          /tmp/account-check-tests
      - name: Build iPhone IPA
        run: bash ci/build-macos.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: shudong-account-check-ipa
          path: build/树洞账号检测.ipa
          if-no-files-found: error
          retention-days: 7
