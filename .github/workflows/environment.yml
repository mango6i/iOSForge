name: Check build environment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/setup-ios/**'
      - '.github/workflows/environment.yml'
      - 'iosforge/**'
      - 'pyproject.toml'
permissions:
  contents: read
concurrency:
  group: iosforge-environment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Verify IPA, dylib and deb toolchains
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ios
        with:
          xcode-version: ${{ vars.IOSFORGE_XCODE_VERSION || '16.4' }}
          theos: 'true'
          diagnostics: 'true'
      - name: Build disposable probes
        run: python -m iosforge.doctor
