name: Hailuo
options:
  bundleIdPrefix: com.hailuo
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HAILUO_WECHAT_APP_ID: hailuo-wechat-unconfigured
    HAILUO_WECHAT_UNIVERSAL_LINK: ""
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Hailuo:
    type: application
    platform: iOS
    sources:
      - path: Hailuo
        excludes:
          - Resources/Info.plist
          - Resources/Hailuo.entitlements
          - Resources/Assets.xcassets
          - Resources/PrivacyInfo.xcprivacy
          - Resources/LaunchScreen.storyboard
          - Resources/MaterialIcons-LICENSE.txt
          - Resources/LiquidGlass-NOTICE.txt
      - path: Hailuo/Resources/Assets.xcassets
        buildPhase: resources
      - path: Hailuo/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Hailuo/Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Hailuo/Resources/MaterialIcons-LICENSE.txt
        buildPhase: resources
      - path: Hailuo/Resources/LiquidGlass-NOTICE.txt
        buildPhase: resources
    info:
      path: Hailuo/Resources/Info.plist
      properties:
        CFBundleDisplayName: 海螺
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: 用于拍摄并发送聊天图片。
        NSPhotoLibraryUsageDescription: 用于选择头像、聊天图片和自定义背景。
        NSMicrophoneUsageDescription: 用于录制和发送语音消息。
        NSLocationWhenInUseUsageDescription: 用于选择并发送当前位置。
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hailuo.app.oauth
            CFBundleURLSchemes:
              - hailuo
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hailuo.app.alipay
            CFBundleURLSchemes:
              - hailuo-alipay
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hailuo.app.wechat
            CFBundleURLSchemes:
              - $(HAILUO_WECHAT_APP_ID)
        HailuoWechatAppID: $(HAILUO_WECHAT_APP_ID)
        HailuoWechatUniversalLink: $(HAILUO_WECHAT_UNIVERSAL_LINK)
        LSApplicationQueriesSchemes:
          - weixin
          - weixinULAPI
          - weixinURLParamsAPI
          - alipay
          - alipays
    entitlements:
      path: Hailuo/Resources/Hailuo.entitlements
      properties:
        aps-environment: $(HAILUO_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hailuo.app
        PRODUCT_NAME: 海螺
        PRODUCT_MODULE_NAME: Hailuo
        # CocoaPods resource scripts create temporary files outside declared outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Hailuo/Hailuo-Bridging-Header.h
      configs:
        Debug:
          HAILUO_APS_ENVIRONMENT: development
        Release:
          HAILUO_APS_ENVIRONMENT: production
  HailuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HailuoTests
    dependencies:
      - target: Hailuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hailuo.app.tests
schemes:
  Hailuo:
    build:
      targets:
        Hailuo: all
        HailuoTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - HailuoTests
